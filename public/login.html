<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · Xlikes</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e12;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .login-card {
      width: 320px;
      padding: 32px 28px;
      background: #151a21;
      border: 1px solid #2f3336;
      border-radius: 16px;
    }
    .logo {
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }
    label { display: block; font-size: 13px; color: #71767b; margin: 12px 0 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2f3336;
      background: #0b0e12;
      color: #e7e9ea;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #1d9bf0; }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px;
      border-radius: 999px;
      border: none;
      background: #1d9bf0;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #1a8cd8; }
    .error { color: #f4212e; font-size: 13px; min-height: 18px; margin-top: 12px; }
    .hint { text-align: center; color: #71767b; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">Xlikes</div>
    <form id="form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">登录</button>
      <div class="error" id="error"></div>
    </form>
    <div class="hint">仅限授权用户访问</div>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('error');
      err.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        location.href = '/';
      } else {
        err.textContent = data.error || '登录失败';
      }
    });
  </script>
</body>
</html>
