services:
  xlikes:
    build: .
    container_name: xlikes
    restart: unless-stopped          # 开机/崩溃后自动拉起
    ports:
      - "5287:3000"                  # HTTPS 主入口 https://<主机IP>:5287
      - "5280:3080"                  # HTTP 跳转 -> https://<主机IP>:5287
    environment:
      XLIKES_MEDIA_ROOT: /data/xlikes # 容器内媒体根目录（部署者自定义，与下方挂载对应）
      XLIKES_HOST_MEDIA_ROOT: /path/to/media # 宿主机媒体根实际路径（部署机视角，用于下载路径映射）
      DATA_DIR: /data/store
      HTTPS_PORT: "3000"
      HTTP_PORT: "3080"
      CERT_DIR: /app/certs
    volumes:
      - /path/to/media:/data/xlikes            # 媒体根目录（改为实际路径；可写，供下载功能使用）
      - /path/to/media/.data:/data/store       # 配置/缓存（建议放媒体根下 .data，容器崩溃不影响数据）
      - /path/to/certs:/app/certs:ro           # HTTPS 自签名证书（改为实际路径）
