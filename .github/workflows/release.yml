name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/weimenet/xlikes:${{ github.ref_name }}
            ghcr.io/weimenet/xlikes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build deployment package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar czf xlikes-$VERSION.tar.gz \
            --exclude=.git --exclude=data --exclude=certs --exclude=docs \
            server.js lib public scripts Dockerfile docker-compose.yml init.d README.md LICENSE
          ls -lh xlikes-$VERSION.tar.gz

      - name: Build release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          {
            echo "## Xlikes $GITHUB_REF_NAME"
            echo ""
            echo "自托管 X（Twitter）媒体库浏览器：瀑布流、ID 索引、帖子详情、gallery-dl 文案抓取、登录保护 + HTTPS。"
            echo ""
            # 优先取 CHANGELOG.md 里本版号的段落；取不到再回退到提交列表
            if [ -f CHANGELOG.md ]; then
              awk -v ver="$VERSION" '
                $0 ~ "^## v?" ver "([^0-9.]|$)" { inside=1; next }
                inside && /^## / { exit }
                inside { print }
              ' CHANGELOG.md > CHANGELOG_SECTION.md
            else
              : > CHANGELOG_SECTION.md
            fi
            if [ -s CHANGELOG_SECTION.md ]; then
              cat CHANGELOG_SECTION.md
            else
              PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
              if [ -n "$PREV_TAG" ]; then
                echo "### 自 $PREV_TAG 以来的变更"
                echo ""
                git log --oneline --no-merges "${PREV_TAG}..${GITHUB_REF_NAME}"
              else
                echo "### 首次发布"
                echo ""
                git log --oneline --no-merges | head -50
              fi
            fi
          } > NOTES.md
          cat NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # 同名 Release 已存在时先删除（重新发布场景），保留 tag
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            "xlikes-$VERSION.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md
